## Render Blueprint — Loans App Backend (Directus)
## Docs: https://render.com/docs/blueprint-spec

databases:
  - name: loans-db
    databaseName: loans
    user: directus
    plan: free # upgrade to 'starter' for production ($7/mo, no spin-down)

services:
  - type: web
    name: loans-directus
    runtime: node
    plan: starter # 'free' spins down after 15 min — use 'starter' for APIs
    rootDir: backend
    buildCommand: npm install && npm run build:extensions
    startCommand: npm run render-start
    healthCheckPath: /server/health

    # Persistent disk for file uploads (required for attachment feature)
    disk:
      name: uploads
      mountPath: /uploads
      sizeGB: 1

    envVars:
      # Directus server
      - key: HOST
        value: "0.0.0.0"
      - key: SECRET
        generateValue: true # Render generates a random secret on first deploy

      # Set this to your actual service URL after first deploy, e.g.:
      # https://loans-directus.onrender.com
      - key: PUBLIC_URL
        sync: false

      # Database — wired to the Postgres service above
      - key: DB_CLIENT
        value: pg
      - key: DB_HOST
        fromDatabase:
          name: loans-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: loans-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: loans-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: loans-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: loans-db
          property: password
      - key: DB_SSL__REJECT_UNAUTHORIZED
        value: "false" # required for Render's internal Postgres

      # Cache (disable unless you add a Redis service)
      - key: CACHE_ENABLED
        value: "false"

      # CORS — restrict to your frontend URL in production
      - key: CORS_ENABLED
        value: "true"
      - key: CORS_ORIGIN
        value: "true"

      # File storage — persisted on the disk mounted above
      - key: STORAGE_LOCATIONS
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /uploads

      # Admin credentials — set manually in Render dashboard (never commit)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      - key: LOG_LEVEL
        value: info
