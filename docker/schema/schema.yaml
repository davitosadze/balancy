version: "3"
directus: "11.0.0"

collections:
  # ─── Contacts ────────────────────────────────────────────────────────────────
  - collection: contacts
    meta:
      icon: contacts
      note: Phone book contacts saved by users
      display_template: "{{name}}"
    schema:
      name: contacts
    fields:
      - field: id
        type: uuid
        meta: { hidden: true, readonly: true }
        schema: { is_primary_key: true, has_auto_increment: false }
      - field: user_created
        type: uuid
        meta: { hidden: true, readonly: true }
        schema: {}
      - field: date_created
        type: timestamp
        meta: { hidden: true, readonly: true, special: ["date-created"] }
        schema: {}
      - field: name
        type: string
        schema: { is_nullable: false }
        meta: { required: true }
      - field: phone
        type: string
        schema: { is_nullable: true }
        meta: {}

  # ─── Loans ───────────────────────────────────────────────────────────────────
  - collection: loans
    meta:
      icon: account_balance_wallet
      note: Loan records (borrow or lend)
      display_template: "{{type}} – {{contact_name}} – {{amount}} {{currency}}"
    schema:
      name: loans
    fields:
      - field: id
        type: uuid
        meta: { hidden: true, readonly: true }
        schema: { is_primary_key: true, has_auto_increment: false }
      - field: user_created
        type: uuid
        meta: { hidden: true, readonly: true }
        schema: {}
      - field: date_created
        type: timestamp
        meta: { hidden: true, readonly: true, special: ["date-created"] }
        schema: {}
      - field: date_updated
        type: timestamp
        meta: { hidden: true, readonly: true, special: ["date-updated"] }
        schema: {}
      - field: type
        type: string
        schema: { is_nullable: false }
        meta:
          required: true
          interface: select-dropdown
          options:
            choices:
              - text: Lent
                value: lent
              - text: Borrowed
                value: borrowed
      - field: contact_name
        type: string
        schema: { is_nullable: false }
        meta: { required: true }
      - field: contact_id
        type: uuid
        schema: { is_nullable: true }
        meta: {}
      - field: phone
        type: string
        schema: { is_nullable: true }
        meta: {}
      - field: amount
        type: decimal
        schema: { is_nullable: false, numeric_precision: 15, numeric_scale: 2 }
        meta: { required: true }
      - field: currency
        type: string
        schema: { is_nullable: false, default_value: "USD" }
        meta:
          required: true
          interface: select-dropdown
          options:
            choices:
              - { text: "GEL – Georgian Lari", value: GEL }
              - { text: "USD – US Dollar", value: USD }
              - { text: "EUR – Euro", value: EUR }
              - { text: "GBP – British Pound", value: GBP }
              - { text: "RUB – Russian Ruble", value: RUB }
              - { text: "TRY – Turkish Lira", value: TRY }
              - { text: "JPY – Japanese Yen", value: JPY }
              - { text: "CNY – Chinese Yuan", value: CNY }
      - field: loan_date
        type: date
        schema: { is_nullable: false }
        meta: { required: true }
      - field: due_date
        type: date
        schema: { is_nullable: true }
        meta: {}
      - field: notes
        type: text
        schema: { is_nullable: true }
        meta: {}
      - field: status
        type: string
        schema: { is_nullable: false, default_value: "active" }
        meta:
          interface: select-dropdown
          options:
            choices:
              - { text: Active, value: active }
              - { text: Partially Paid, value: partially_paid }
              - { text: Paid, value: paid }
      - field: interest_rate
        type: decimal
        schema: { is_nullable: true }
        meta: {}
      - field: participants
        type: text
        schema: { is_nullable: true }
        meta:
          note: "JSON array of shared loan participants: [{name, phone?, amount}]"
      - field: archived
        type: boolean
        schema: { is_nullable: false, default_value: false }
        meta: { note: "Soft-archive: hides from active list without deleting" }
      - field: attachment_id
        type: uuid
        schema: { is_nullable: true }
        meta:
          {
            note: "Directus file ID for attached signed note / bank confirmation",
          }

  # ─── Repayments ──────────────────────────────────────────────────────────────
  - collection: repayments
    meta:
      icon: payments
      note: Repayment records linked to a loan
      display_template: "{{amount}} on {{date}}"
    schema:
      name: repayments
    fields:
      - field: id
        type: uuid
        meta: { hidden: true, readonly: true }
        schema: { is_primary_key: true, has_auto_increment: false }
      - field: user_created
        type: uuid
        meta: { hidden: true, readonly: true }
        schema: {}
      - field: date_created
        type: timestamp
        meta: { hidden: true, readonly: true, special: ["date-created"] }
        schema: {}
      - field: loan_id
        type: uuid
        schema: { is_nullable: false }
        meta: { required: true }
      - field: amount
        type: decimal
        schema: { is_nullable: false, numeric_precision: 15, numeric_scale: 2 }
        meta: { required: true }
      - field: date
        type: date
        schema: { is_nullable: false }
        meta: { required: true }
      - field: notes
        type: text
        schema: { is_nullable: true }
        meta: {}
      - field: paid_by
        type: string
        schema: { is_nullable: true }
        meta: { note: "Name of participant who made this payment" }

  # ─── App Translations ────────────────────────────────────────────────────────
  - collection: app_translations
    meta:
      icon: translate
      note: CMS-managed multilingual strings for the mobile app
      display_template: "{{language_code}}.{{key}}"
    schema:
      name: app_translations
    fields:
      - field: id
        type: integer
        meta: { hidden: true, readonly: true }
        schema: { is_primary_key: true, has_auto_increment: true }
      - field: language_code
        type: string
        schema: { is_nullable: false }
        meta: { required: true }
      - field: key
        type: string
        schema: { is_nullable: false }
        meta: { required: true }
      - field: value
        type: text
        schema: { is_nullable: false }
        meta: { required: true, interface: input-multiline }

relations:
  - collection: loans
    field: contact_id
    related_collection: contacts
    meta:
      junction_field: null
  - collection: repayments
    field: loan_id
    related_collection: loans
    meta:
      junction_field: null
