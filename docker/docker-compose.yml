services:
  database:
    image: postgres:16-alpine
    container_name: loans_postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-loans}
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-directus_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-directus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - loans_network

  cache:
    image: redis:7-alpine
    container_name: loans_redis
    networks:
      - loans_network

  directus:
    image: directus/directus:11
    container_name: loans_directus
    ports:
      - "8055:8055"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
      - ./schema:/directus/schema
    environment:
      SECRET: ${DIRECTUS_SECRET:-change_me_in_production_very_long_secret}

      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-loans}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DB_PASSWORD:-directus_password}

      CACHE_ENABLED: "true"
      CACHE_STORE: redis
      REDIS: "redis://cache:6379"

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@loans.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}

      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}

      # CORS — allow the Expo app (dev + prod)
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"

      # Email (optional, configure for password reset)
      EMAIL_FROM: ${EMAIL_FROM:-noreply@loans.app}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}

      # OAuth providers — comment out AUTH_PROVIDERS line if not using social login
      # AUTH_PROVIDERS: ${AUTH_PROVIDERS:-google,apple}
      # AUTH_GOOGLE_DRIVER: openid
      # AUTH_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # AUTH_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # AUTH_GOOGLE_ISSUER_URL: "https://accounts.google.com"
      # AUTH_GOOGLE_IDENTIFIER_KEY: email
      # AUTH_GOOGLE_ALLOW_PUBLIC_REGISTRATION: "true"
      # AUTH_GOOGLE_DEFAULT_ROLE_ID: ${DEFAULT_ROLE_ID:-}

      # Apple OAuth
      # AUTH_APPLE_DRIVER: openid
      # AUTH_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      # AUTH_APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      # AUTH_APPLE_ISSUER_URL: "https://appleid.apple.com"
      # AUTH_APPLE_IDENTIFIER_KEY: email
      # AUTH_APPLE_ALLOW_PUBLIC_REGISTRATION: "true"
      # AUTH_APPLE_DEFAULT_ROLE_ID: ${DEFAULT_ROLE_ID:-}

      # Storage
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads

    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - loans_network

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:

networks:
  loans_network:
    driver: bridge
